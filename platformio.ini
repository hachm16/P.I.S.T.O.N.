[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Force the PlatformIO framework to bind Serial directly to native hardware USB pins
board_build.core = esp32
board_build.arduino.memory_type = qio_opi

; Explicitly unlock your full N16R8 hardware capacity
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Crucial combinations to prevent the USB port from dropping after flashing
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM

monitor_speed = 115200
